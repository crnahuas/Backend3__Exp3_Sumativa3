# Application Configuration for BFF Cajero
spring.application.name=bffcajero

# Core Service Configuration
core.base-url=${CORE_BASE_URL:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

# CORS Configuration
cors.allowed-origins=${CORS_CAJERO_ALLOWED_ORIGINS:http://localhost:4200}
cors.allowed-methods=GET,POST,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Request-Id,X-Correlation-Id
cors.exposed-headers=X-Request-Id,X-Correlation-Id

# Eureka Client Configuration
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.backendCore.register-health-indicator=true
resilience4j.circuitbreaker.instances.backendCore.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.backendCore.sliding-window-size=5
resilience4j.circuitbreaker.instances.backendCore.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.backendCore.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.backendCore.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.backendCore.ignore-exceptions=cl.duoc.bffcajero.exception.CoreClientException
resilience4j.timelimiter.instances.backendCore.timeout-duration=3s
