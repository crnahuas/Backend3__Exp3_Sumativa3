spring.application.name=ms-mensajeria
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server.port=8085

# Se habilita desde Config Server cuando se ejecuta todo el ecosistema.
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics

# Valores locales; Config Server puede sobrescribirlos.
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
app.jms.queue.retiros=retiros.procesados
app.jms.queue.dlq=ActiveMQ.DLQ
app.jms.retry.max-redeliveries=${JMS_MAX_REDELIVERIES:3}
app.jms.retry.initial-delay-ms=${JMS_INITIAL_REDELIVERY_DELAY_MS:1000}
app.jms.retry.backoff-multiplier=${JMS_REDELIVERY_BACKOFF_MULTIPLIER:2.0}
app.jms.consumer.concurrency=${JMS_CONSUMER_CONCURRENCY:1-3}
