name: banco-xyz-semana8

x-spring-service: &spring-service
  restart: unless-stopped
  networks:
    - banco-network

x-resource-server-environment: &resource-server-environment
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_CLIENT_ENABLED: "true"
  EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
  OAUTH2_ISSUER_URI: http://auth-server:9000
  OAUTH2_JWK_SET_URI: http://auth-server:9000/oauth2/jwks

services:
  activemq:
    image: apache/activemq-classic:latest
    container_name: banco-activemq
    restart: unless-stopped
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - activemq-data:/opt/apache-activemq/data
    networks:
      - banco-network

  config-server:
    <<: *spring-service
    image: banco/config-server:semana8
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  discovery-server:
    <<: *spring-service
    image: banco/discovery-server:semana8
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  auth-server:
    <<: *spring-service
    image: banco/auth-server:semana8
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-server
    environment:
      OAUTH2_ISSUER_URI: http://auth-server:9000
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-banco-client}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:?Defina OAUTH2_CLIENT_SECRET en el archivo .env}
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/oauth2/jwks | grep -q keys"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend-core:
    <<: *spring-service
    image: banco/backend-core:semana8
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: backend-core
    environment:
      <<: *resource-server-environment
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USER: admin
      ACTIVEMQ_PASSWORD: admin
      ORACLE_DB_USERNAME: ${ORACLE_DB_USERNAME:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Defina ORACLE_PASSWORD en el archivo .env}
      ORACLE_JDBC_URL: jdbc:oracle:thin:@procesobasedatos_high?TNS_ADMIN=/opt/oracle/wallet
    volumes:
      - ./.local/oracle-wallet:/opt/oracle/wallet:ro
    ports:
      - "8081:8081"
    depends_on:
      activemq:
        condition: service_started
      auth-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  bffweb:
    <<: *spring-service
    image: banco/bffweb:semana8
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: bffweb
    environment:
      <<: *resource-server-environment
      CORE_BASE_URL: http://backend-core:8081
      SERVER_SSL_ENABLED: "false"
    ports:
      - "8082:8082"
    depends_on:
      backend-core:
        condition: service_healthy

  bffmobile:
    <<: *spring-service
    image: banco/bffmobile:semana8
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: bffmobile
    environment:
      <<: *resource-server-environment
      CORE_BASE_URL: http://backend-core:8081
      SERVER_SSL_ENABLED: "false"
    ports:
      - "8083:8083"
    depends_on:
      backend-core:
        condition: service_healthy

  bffcajero:
    <<: *spring-service
    image: banco/bffcajero:semana8
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: bffcajero
    environment:
      <<: *resource-server-environment
      CORE_BASE_URL: http://backend-core:8081
      SERVER_SSL_ENABLED: "false"
    ports:
      - "8084:8084"
    depends_on:
      backend-core:
        condition: service_healthy

  ms-mensajeria:
    <<: *spring-service
    image: banco/ms-mensajeria:semana8
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ms-mensajeria
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USER: admin
      ACTIVEMQ_PASSWORD: admin
      JMS_MAX_REDELIVERIES: "3"
      JMS_INITIAL_REDELIVERY_DELAY_MS: "1000"
      JMS_REDELIVERY_BACKOFF_MULTIPLIER: "2.0"
      JMS_CONSUMER_CONCURRENCY: 1-3
    ports:
      - "8085:8085"
    depends_on:
      activemq:
        condition: service_started
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

networks:
  banco-network:
    name: banco-network
    driver: bridge

volumes:
  activemq-data:
    name: banco-activemq-data
