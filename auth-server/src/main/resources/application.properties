spring.application.name=auth-server
server.port=9000

# Emisor que quedara registrado en el claim "iss" de cada JWT.
spring.security.oauth2.authorizationserver.issuer=${OAUTH2_ISSUER_URI:http://localhost:9000}

# Cliente tecnico para demostrar el flujo OAuth2 client_credentials.
spring.security.oauth2.authorizationserver.client.banco.registration.client-id=${OAUTH2_CLIENT_ID:banco-client}
spring.security.oauth2.authorizationserver.client.banco.registration.client-secret={noop}${OAUTH2_CLIENT_SECRET:changeit-local-only}
spring.security.oauth2.authorizationserver.client.banco.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.banco.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.banco.registration.scopes[0]=cuentas.read
spring.security.oauth2.authorizationserver.client.banco.registration.scopes[1]=retiros.write
spring.security.oauth2.authorizationserver.client.banco.token.access-token-time-to-live=15m

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
