spring.application.name=bffmobile
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server.port=8083
server.ssl.enabled=true
server.ssl.key-store=${BFF_MOBILE_KEYSTORE:classpath:certs/bffmobile.p12}
server.ssl.key-store-password=${BFF_MOBILE_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bffmobile

core.base-url=${CORE_BASE_URL:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

# Se habilita cuando el ecosistema de Semana 6 se ejecuta junto a Eureka.
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

cors.allowed-origins=${CORS_MOBILE_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8100,capacitor://localhost}
cors.allowed-methods=GET,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Request-Id
cors.exposed-headers=X-Request-Id

management.endpoints.web.exposure.include=health,info,metrics

# Los errores 4xx del core son respuestas validas y no representan indisponibilidad.
resilience4j.circuitbreaker.instances.backendCore.ignore-exceptions=cl.duoc.bffmobile.exception.CoreClientException
