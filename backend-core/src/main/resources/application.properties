spring.application.name=formativa1
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# ==========================================
# BACKEND CORE - ACTIVIDAD BFF
# ==========================================

server.port=8081

# Se habilita cuando el ecosistema de Semana 6 se ejecuta junto a Eureka.
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics

# OAuth2 Resource Server: valida firma, expiracion, emisor y scopes del JWT.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

# Valores locales; Config Server los centraliza al ejecutar el ecosistema completo.
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
app.jms.queue.retiros=retiros.procesados

# Evita ejecutar los Jobs Batch al iniciar la API
spring.batch.job.enabled=false

# ==========================================
# ORACLE CLOUD
# ==========================================

spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@procesobasedatos_high?TNS_ADMIN=/opt/oracle/wallet}
spring.datasource.username=${ORACLE_DB_USERNAME:ADMIN}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==========================================
# INICIALIZACION SQL
# ==========================================

# Las tablas de negocio ya existen en Oracle,
# por lo tanto no se ejecutan scripts SQL locales automáticamente.
spring.sql.init.mode=never

spring.sql.init.platform=oracle


# ==========================================
# ARCHIVOS CSV
# ==========================================

# Seleccionar el archivo correspondiente al Job que se desea ejecutar.

# 1 - transaccionesJob
app.input-file=classpath:transacciones.csv

# 2 - interesesJob
# app.input-file=classpath:intereses.csv

# 3 - estadosCuentaJob
# app.input-file=classpath:cuentas_anuales.csv


# ==========================================
# SPRING BATCH
# ==========================================

spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.platform=oracle
spring.batch.jdbc.isolation-level-for-create=READ_COMMITTED


# ==========================================
# JOB A EJECUTAR
# ==========================================

# 1 - transaccionesJob
spring.batch.job.name=transaccionesJob

# 2 - interesesJob
# spring.batch.job.name=interesesJob

# 3 - estadosCuentaJob
# spring.batch.job.name=estadosCuentaJob


# ==========================================
# PARTICIONAMIENTO + ORACLE
# ==========================================

# Evita conflictos entre el procesamiento particionado de Spring Batch
# y el Parallel DML interno de Oracle.
spring.datasource.hikari.connection-init-sql=ALTER SESSION DISABLE PARALLEL DML

# ==========================================
# CONFIGURACION DE PARTICIONES
# ==========================================

# Cantidad de particiones
app.partition.grid-size=4

# Cantidad de hilos
app.partition.threads=4
